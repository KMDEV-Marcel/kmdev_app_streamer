# Baut den Windows-Installer und veroeffentlicht ihn als GitHub Release.
# Ausloeser: ein Tag wie v0.2.0 (muss zur version in package.json passen).
# Die installierten Apps holen sich das Update dann automatisch.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version pruefen
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) { throw "Tag v$tag passt nicht zu package.json ($pkg)" }

      - run: npm ci

      - name: Bauen und veroeffentlichen
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
