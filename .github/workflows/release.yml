# Baut den Windows-Installer und veroeffentlicht ihn als GitHub Release.
# Ausloeser: ein Tag wie v0.2.0 (muss zur version in package.json passen).
# Die installierten Apps holen sich das Update dann automatisch.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version pruefen
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) { throw "Tag v$tag passt nicht zu package.json ($pkg)" }

      - run: npm ci

      - name: Bauen und veroeffentlichen
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TURN-Server fuer den Windows-Server, haengt als Asset am selben Release.
      # install-server.ps1 laedt ihn von dort und prueft die SHA256.
      - uses: actions/setup-go@v5
        with:
          go-version-file: turn/go.mod
          cache-dependency-path: turn/go.sum

      - name: TURN-Server bauen
        working-directory: turn
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w" -o kmdev-turn.exe .
          (Get-FileHash kmdev-turn.exe -Algorithm SHA256).Hash.ToLower() + '  kmdev-turn.exe' | Set-Content -NoNewline kmdev-turn.exe.sha256

      - name: TURN-Server ans Release haengen
        working-directory: turn
        run: gh release upload ${{ github.ref_name }} kmdev-turn.exe kmdev-turn.exe.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
